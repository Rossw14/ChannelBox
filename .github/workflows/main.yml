name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ChannelBox.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ChannelBox-apk
          path: ChannelBox.apk

      # Publishes the build as the project's latest release, which is where
      # the app's "Check for updates" button looks.
      - name: Publish for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"versionCode\": $((100 + ${{ github.run_number }})), \"versionName\": \"1.5 (build ${{ github.run_number }})\"}" > version.json
          gh release create "build-${{ github.run_number }}" ChannelBox.apk version.json \
            --title "ChannelBox build ${{ github.run_number }}" \
            --notes "Built automatically from the latest code." \
            --latest
